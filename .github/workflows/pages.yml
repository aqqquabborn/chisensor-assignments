name: Check and publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: 01_room_prototype/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: "Assignment 1: install, build, unit checks"
        working-directory: 01_room_prototype
        run: |
          npm ci
          npm run build
          npm test

      - name: "Assignment 1: browser checks at 390 px"
        working-directory: 01_room_prototype
        run: |
          npm install --no-save playwright@1.63.0
          npx playwright install --with-deps chromium
          npm run test:e2e

      - name: "Assignment 2: checks and report"
        working-directory: 02_evidence_tool
        run: |
          python -m unittest -v
          python analyze.py --strict

      - name: Build site
        env:
          REPO_URL: https://github.com/${{ github.repository }}
        run: python site/build_site.py 01_room_prototype 02_evidence_tool _site

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
